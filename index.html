<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Flipper</title>
    <link rel="stylesheet" href="styles..css">
</head>
<body>
    <div class="container">
        <h1>Color Flipper</h1>
        <div class="color-display" id="color-display"></div>

        <div class="btn-group">
            <button id="simple-btn">Regular color</button>
            <button id="hex-btn">Hex Color</button>
        </div>

        <button id="copy-btn">Copy Color Code</button>

        <div class="history" id="history"></div>
    </div>
    

    <script src="app.js"></script>
</body>
</html>
